name: QA quality gates

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean test
      - name: Generate Allure report
        if: always()
        run: |
          if compgen -G 'target/allure-results/*-result.json' > /dev/null; then
            mvn -B allure:report
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            profile: playwright
          - browser: firefox
            profile: firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Playwright browser
        run: >-
          mvn -B -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI
          "-Dexec.args=install --with-deps ${{ matrix.browser }}" exec:java
      - run: mvn -B test -P${{ matrix.profile }}
      - name: Generate Allure report
        if: always()
        run: |
          if compgen -G 'target/allure-results/*-result.json' > /dev/null; then
            mvn -B allure:report
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            target/playwright-evidence/

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.57.0'
      - run: ./performance/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            target/k6-summary.json
            target/booking-fixture.*.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [integration, browser, performance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=java-test-automation-framework/ \
            -o java-test-automation-framework.zip HEAD
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" java-test-automation-framework.zip --clobber
          else
            gh release create "$RELEASE_TAG" java-test-automation-framework.zip \
              --verify-tag --generate-notes
          fi
