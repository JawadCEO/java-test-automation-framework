name: QA quality gates

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  test:
    name: Unit, API, contract, DB, BDD and observability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify runs the suites and then enforces the JaCoCo line and branch coverage gate.
      - run: mvn clean verify
      - name: Generate Allure report
        if: always()
        run: |
          if compgen -G 'target/allure-results/*-result.json' > /dev/null; then
            mvn allure:report
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/allure-results/
            target/site/allure-maven-plugin/

  browser:
    name: UI (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: playwright-chromium
            browser: chromium
            profile: playwright
          - name: playwright-firefox
            browser: firefox
            profile: firefox
          - name: selenium-chrome
            profile: selenium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Playwright browser
        if: matrix.browser
        run: >-
          mvn -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI
          "-Dexec.args=install --with-deps ${{ matrix.browser }}" test-compile exec:java
      - run: mvn test -P${{ matrix.profile }} -Djacoco.skip=true
      - name: Generate Allure report
        if: always()
        run: |
          if compgen -G 'target/allure-results/*-result.json' > /dev/null; then
            mvn allure:report
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.name }}-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            target/playwright-evidence/

  performance:
    name: JMeter load test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./performance/jmeter.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-results
          path: |
            target/jmeter/results/
            target/jmeter/reports/
            target/booking-server-jmeter.log

  kpis:
    name: QA KPIs
    needs: [test, browser, performance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
      # Fails the job when JMeter p95 exceeds the 250 ms budget.
      - name: Compute KPIs
        run: >-
          mvn test-compile exec:java -Dexec.classpathScope=test
          -Dexec.mainClass=com.jawad.qa.kpi.QaKpiReport "-Dexec.args=target/qa-kpis ci-artifacts"
      - name: Publish job summary
        if: always()
        run: |
          if [ -f target/qa-kpis/kpis.md ]; then
            cat target/qa-kpis/kpis.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-kpis
          path: target/qa-kpis/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, browser, performance, kpis]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=java-test-automation-framework/ \
            -o java-test-automation-framework.zip HEAD
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" java-test-automation-framework.zip --clobber
          else
            gh release create "$RELEASE_TAG" java-test-automation-framework.zip \
              --verify-tag --generate-notes
          fi
