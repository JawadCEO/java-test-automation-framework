global:
  scrape_interval: 15s
scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  # The booking service's own /metrics, when it runs on the host with BOOKING_PORT=8085.
  - job_name: booking-service
    static_configs:
      - targets: ["host.docker.internal:8085"]
